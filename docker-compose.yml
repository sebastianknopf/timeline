name: ${COMPOSE_PROJECT_NAME:-timeline}

services:
  db:
    image: postgres:16-alpine
    container_name: timeline-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    container_name: timeline-processor
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROCESSOR_DATABASE_URL: ${PROCESSOR_DATABASE_URL}
      PROCESSOR_CONFIG_PATH: /app/config/config.yaml
      PROCESSOR_MAPPING_ROOT: /etc/mapping
      PROCESSOR_TIMEZONE: ${PROCESSOR_TIMEZONE:-UTC}
      PROCESSOR_GLOBAL_ID_PATTERN: ${PROCESSOR_GLOBAL_ID_PATTERN}
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "processor"]
    volumes:
      - type: bind
        source: ./processor
        target: /app
      - type: bind
        source: ./config/config.yaml
        target: /app/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - ${PROCESSOR_MAPPING_DIR:-.}/mapping:/etc/mapping:ro
      - ${PROCESSOR_EXPORT_DIR:-processor_exports}:/var/data/exports
      - ${PROCESSOR_SECURITY_DIR:-.}/security:/etc/security:ro

  loki:
    image: grafana/loki:3.1.1
    container_name: timeline-loki
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/config.yml"]
    expose:
      - "3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro

  promtail:
    image: grafana/promtail:3.1.1
    container_name: timeline-promtail
    profiles: ["monitoring"]
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    depends_on:
      - loki
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-timeline}
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.1.4
    container_name: timeline-grafana
    profiles: ["grafana"]
    depends_on:
      - db
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_LANGUAGE: ${GRAFANA_DEFAULT_LANGUAGE:-de-DE}
      GF_USERS_DEFAULT_THEME: ${GRAFANA_DEFAULT_THEME:-light}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/timeline-overview.json
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  grafana_data:
  processor_exports: