[build-system]
requires = ["setuptools>=69", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-processor"
description = "Timeline ETL processor service"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "alembic>=1.13,<2.0",
  "croniter>=3.0,<4.0",
  "gtfs-realtime-bindings>=1.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "PyYAML>=6.0,<7.0",
  "SQLAlchemy>=2.0,<3.0",
  "structlog>=24.2,<25.0",
]

[project.scripts]
processor = "processor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.1.0"